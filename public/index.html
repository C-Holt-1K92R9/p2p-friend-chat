<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friend Chat</title>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; height: 100vh; overflow: hidden; }
    
    /* Registration */
    .registration { position: fixed; inset: 0; background: linear-gradient(135deg, #667eea, #764ba2); 
      display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .registration.hidden { display: none; }
    .reg-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 400px; width: 90%; text-align: center; }
    .reg-card h1 { font-size: 32px; margin-bottom: 20px; color: #667eea; }
    .reg-card input { width: 100%; padding: 14px; border: 2px solid #e5e7eb; border-radius: 12px; 
      font-size: 16px; margin-bottom: 20px; }
    .reg-card button { width: 100%; padding: 14px; background: #667eea; color: white; border: none;
      border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
    
    /* Main Layout */
    .container { display: flex; height: 100vh; }
    .sidebar { width: 300px; background: #2d3748; color: white; display: flex; flex-direction: column; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .user-name { font-size: 18px; font-weight: 600; margin-bottom: 10px; }
    .add-friend-btn { width: 100%; padding: 12px; background: #667eea; border: none; color: white;
      border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    
    .friends-list { flex: 1; overflow-y: auto; padding: 10px; }
    .friend-item { padding: 12px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 8px;
      cursor: pointer; transition: background 0.2s; }
    .friend-item:hover { background: rgba(255,255,255,0.1); }
    .friend-item.active { background: #667eea; }
    .friend-name { font-weight: 600; }
    .friend-status { font-size: 12px; color: #a0aec0; }
    .friend-status.online { color: #48bb78; }
    
    .empty { padding: 40px 20px; text-align: center; color: #a0aec0; }
    
    /* Chat */
    .main { flex: 1; display: flex; flex-direction: column; background: #f7fafc; }
    .chat-header { padding: 20px; background: white; border-bottom: 1px solid #e2e8f0; }
    .chat-title { font-size: 18px; font-weight: 600; }
    
    .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .message { display: flex; gap: 10px; max-width: 70%; }
    .message.own { margin-left: auto; flex-direction: row-reverse; }
    .message-bubble { padding: 10px 14px; border-radius: 12px; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .message.own .message-bubble { background: #667eea; color: white; }
    .message-user { font-size: 12px; font-weight: 600; color: #667eea; margin-bottom: 4px; }
    .message.own .message-user { color: rgba(255,255,255,0.8); }
    .message-time { font-size: 10px; color: #a0aec0; margin-top: 4px; }
    
    .input-area { padding: 20px; background: white; border-top: 1px solid #e2e8f0; display: flex; gap: 10px; }
    .message-input { flex: 1; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; }
    .send-btn { padding: 12px 24px; background: #667eea; color: white; border: none; border-radius: 8px;
      font-weight: 600; cursor: pointer; }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none;
      align-items: center; justify-content: center; z-index: 10000; }
    .modal-overlay.active { display: flex; }
    .modal { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 400px; width: 90%; text-align: center; }
    .modal h2 { margin-bottom: 20px; }
    .code-display { font-size: 36px; font-weight: 700; color: #667eea; letter-spacing: 8px; margin: 20px 0;
      padding: 20px; background: #f7fafc; border-radius: 12px; }
    .modal input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px;
      text-align: center; font-size: 18px; letter-spacing: 4px; margin-bottom: 20px; }
    .modal-buttons { display: flex; gap: 10px; }
    .modal-buttons button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: #667eea; color: white; }
    .btn-secondary { background: #e2e8f0; color: #2d3748; }
    .countdown { font-size: 12px; color: #e53e3e; margin-top: 10px; }
  </style>
</head>
<body>
  <!-- Registration Screen -->
  <div class="registration" id="regScreen">
    <div class="reg-card">
      <h1>👋 Welcome</h1>
      <p>Enter your name to start</p>
      <input type="text" id="regName" placeholder="Your name" maxlength="20" />
      <button onclick="register()">Continue</button>
    </div>
  </div>

  <!-- Main App -->
  <div class="container">
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="user-name" id="userName">Loading...</div>
        <div id="status">Connecting...</div>
        <button class="add-friend-btn" onclick="openAddFriend()">+ Add Friend</button>
      </div>
      <div class="friends-list" id="friendsList">
        <div class="empty">No friends yet<br>Add a friend to start!</div>
      </div>
    </div>

    <div class="main">
      <div class="chat-header">
        <div class="chat-title" id="chatTitle">Select a friend</div>
      </div>
      <div class="messages" id="messages">
        <div class="empty">Select a friend to chat</div>
      </div>
      <div class="input-area">
        <input type="text" class="message-input" id="msgInput" placeholder="Type a message..." disabled />
        <button class="send-btn" id="sendBtn" onclick="sendMsg()" disabled>Send</button>
      </div>
    </div>
  </div>

  <!-- Add Friend Modal -->
  <div class="modal-overlay" id="addFriendModal">
    <div class="modal">
      <h2>Add Friend</h2>
      <div id="genSection">
        <button class="btn-primary" style="width:100%; padding:14px; margin-bottom:20px;" onclick="genCode()">
          Generate My Code
        </button>
      </div>
      <div id="codeSection" style="display:none;">
        <p>Share this code:</p>
        <div class="code-display" id="codeDisplay">------</div>
        <div class="countdown" id="countdown"></div>
      </div>
      <div style="margin:20px 0; color:#a0aec0;">OR</div>
      <input type="text" id="codeInput" placeholder="Enter friend's code" maxlength="6" />
      <div class="modal-buttons">
        <button class="btn-secondary" onclick="closeAddFriend()">Cancel</button>
        <button class="btn-primary" onclick="enterCode()">Add</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io(window.location.origin, { transports: ['websocket'], reconnection: true });
    let currentUser = null;
    let friends = new Map();
    let selectedFriend = null;
    let pc = null, dataChannel = null, countdownTimer = null;

    // Init
    function init() {
      const saved = localStorage.getItem('chatUser');
      if (saved) {
        const user = JSON.parse(saved);
        currentUser = user;
        socket.emit('login', user.userId);
        document.getElementById('regScreen').classList.add('hidden');
      }
    }

    function register() {
      const name = document.getElementById('regName').value.trim();
      if (!name) return alert('Enter your name');
      socket.emit('register', name);
    }

    // Socket events
    socket.on('connect', () => document.getElementById('status').textContent = 'Connected');
    socket.on('disconnect', () => document.getElementById('status').textContent = 'Disconnected');
    
    socket.on('registered', (data) => {
      currentUser = data;
      localStorage.setItem('chatUser', JSON.stringify({ userId: data.userId, username: data.username }));
      document.getElementById('regScreen').classList.add('hidden');
      document.getElementById('userName').textContent = data.username;
      data.friends.forEach(f => friends.set(f.userId, f));
      renderFriends();
    });
    
    socket.on('logged-in', (data) => {
      currentUser = data;
      document.getElementById('userName').textContent = data.username;
      data.friends.forEach(f => friends.set(f.userId, f));
      renderFriends();
    });
    
    socket.on('login-failed', () => {
      localStorage.removeItem('chatUser');
      document.getElementById('regScreen').classList.remove('hidden');
    });
    
    socket.on('friend-code-generated', (data) => {
      document.getElementById('codeDisplay').textContent = data.code;
      document.getElementById('genSection').style.display = 'none';
      document.getElementById('codeSection').style.display = 'block';
      startCountdown(new Date(data.expiresAt));
    });
    
    socket.on('friend-code-error', (data) => alert(data.error));
    
    socket.on('friend-added', (f) => {
      friends.set(f.userId, f);
      renderFriends();
      closeAddFriend();
      alert(f.username + ' added!');
    });
    
    socket.on('friend-online', (data) => {
      const f = friends.get(data.userId);
      if (f) { f.online = true; renderFriends(); }
    });
    
    socket.on('friend-offline', (data) => {
      const f = friends.get(data.userId);
      if (f) { f.online = false; renderFriends(); }
    });

    // P2P
    socket.on('p2p-begin', async ({ role, peerId, friendUserId }) => {
      console.log('P2P begin', role);
      pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
      
      pc.ondatachannel = (e) => { dataChannel = e.channel; setupDataChannel(friendUserId); };
      
      if (role === 'initiator') {
        dataChannel = pc.createDataChannel('chat');
        setupDataChannel(friendUserId);
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        setTimeout(() => socket.emit('webrtc-offer', { to: peerId, sdp: pc.localDescription }), 1000);
      }
    });
    
    socket.on('webrtc-offer', async ({ from, sdp }) => {
      if (!pc) return;
      await pc.setRemoteDescription(sdp);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      setTimeout(() => socket.emit('webrtc-answer', { to: from, sdp: pc.localDescription }), 1000);
    });
    
    socket.on('webrtc-answer', async ({ sdp }) => {
      if (!pc) return;
      await pc.setRemoteDescription(sdp);
    });

    function setupDataChannel(friendUserId) {
      if (!dataChannel) return;
      dataChannel.onopen = () => {
        console.log('P2P connected');
        loadMessages(friendUserId);
      };
      dataChannel.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        addMsg({ username: msg.username, text: msg.text, timestamp: msg.timestamp, fromFriend: true });
        saveMsg(msg.fromUserId, msg);
      };
    }

    function sendP2P(text) {
      if (!dataChannel || dataChannel.readyState !== 'open') return alert('Not connected');
      const msg = { type: 'message', fromUserId: currentUser.userId, username: currentUser.username, 
        text, timestamp: new Date().toISOString() };
      dataChannel.send(JSON.stringify(msg));
      addMsg({ username: currentUser.username, text, timestamp: msg.timestamp, fromFriend: false });
      saveMsg(selectedFriend.userId, msg);
    }

    // UI
    function renderFriends() {
      const list = document.getElementById('friendsList');
      if (friends.size === 0) {
        list.innerHTML = '<div class="empty">No friends yet<br>Add a friend to start!</div>';
        return;
      }
      let html = '';
      friends.forEach(f => {
        const active = selectedFriend && selectedFriend.userId === f.userId ? 'active' : '';
        const status = f.online ? 'online' : '';
        html += `<div class="friend-item ${active}" onclick="selectFriend('${f.userId}')">
          <div class="friend-name">${esc(f.username)}</div>
          <div class="friend-status ${status}">${f.online ? 'Online' : 'Offline'}</div>
        </div>`;
      });
      list.innerHTML = html;
    }

    function selectFriend(id) {
      selectedFriend = friends.get(id);
      if (!selectedFriend) return;
      renderFriends();
      document.getElementById('chatTitle').textContent = selectedFriend.username;
      document.getElementById('msgInput').disabled = false;
      document.getElementById('sendBtn').disabled = false;
      loadMessages(id);
      if (selectedFriend.online) socket.emit('request-friend-address', id);
    }

    function addMsg(msg) {
      const msgDiv = document.getElementById('messages');
      if (msgDiv.querySelector('.empty')) msgDiv.innerHTML = '';
      const isOwn = !msg.fromFriend;
      const time = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const div = document.createElement('div');
      div.className = `message ${isOwn ? 'own' : ''}`;
      div.innerHTML = `<div class="message-bubble">
        ${!isOwn ? `<div class="message-user">${esc(msg.username)}</div>` : ''}
        <div>${esc(msg.text)}</div>
        <div class="message-time">${time}</div>
      </div>`;
      msgDiv.appendChild(div);
      msgDiv.scrollTop = msgDiv.scrollHeight;
    }

    function sendMsg() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text || !selectedFriend) return;
      sendP2P(text);
      input.value = '';
    }

    document.getElementById('msgInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMsg();
    });

    // Storage
    function saveMsg(friendId, msg) {
      const key = `msgs_${currentUser.userId}_${friendId}`;
      const msgs = JSON.parse(localStorage.getItem(key) || '[]');
      msgs.push(msg);
      localStorage.setItem(key, JSON.stringify(msgs.slice(-100)));
    }

    function loadMessages(friendId) {
      const key = `msgs_${currentUser.userId}_${friendId}`;
      const msgs = JSON.parse(localStorage.getItem(key) || '[]');
      const msgDiv = document.getElementById('messages');
      msgDiv.innerHTML = '';
      if (msgs.length === 0) {
        msgDiv.innerHTML = '<div class="empty">Start chatting!</div>';
        return;
      }
      msgs.forEach(m => addMsg({ username: m.username, text: m.text, timestamp: m.timestamp, 
        fromFriend: m.fromUserId !== currentUser.userId }));
    }

    // Modal
    function openAddFriend() {
      document.getElementById('addFriendModal').classList.add('active');
      document.getElementById('genSection').style.display = 'block';
      document.getElementById('codeSection').style.display = 'none';
      document.getElementById('codeInput').value = '';
    }

    function closeAddFriend() {
      document.getElementById('addFriendModal').classList.remove('active');
      if (countdownTimer) clearInterval(countdownTimer);
    }

    function genCode() {
      socket.emit('generate-friend-code');
    }

    function enterCode() {
      const code = document.getElementById('codeInput').value.trim();
      if (code.length !== 6) return alert('Enter 6-digit code');
      socket.emit('enter-friend-code', code);
    }

    function startCountdown(expiresAt) {
      const update = () => {
        const diff = expiresAt - new Date();
        if (diff <= 0) {
          document.getElementById('countdown').textContent = 'Expired';
          clearInterval(countdownTimer);
          return;
        }
        const m = Math.floor(diff / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        document.getElementById('countdown').textContent = `Expires in ${m}:${s.toString().padStart(2, '0')}`;
      };
      update();
      countdownTimer = setInterval(update, 1000);
    }

    function esc(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
